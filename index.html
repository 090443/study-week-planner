<!DOCTYPE html>
<!--
  文件用途：大学生一周学习计划生成器（单文件版）
  说明：纯前端静态工具，无登录、无后端、无接口、无外部资源。
  用法：用浏览器直接打开本文件，选择任务 / 时间 / 薄弱项 / 截止紧迫度后点击“生成本周计划”。
  技术：原生 HTML + CSS + JavaScript，全部逻辑与样式内联在本文件内。
-->
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>大学生一周学习计划生成器</title>
<style>
/* ============================================================
   1. 主题变量与基础重置
   ============================================================ */
:root{
  --bg:#f3f8f7;
  --card:#ffffff;
  --ink:#102e2c;
  --ink-soft:#43605d;
  --muted:#7b918f;
  --brand:#0f8f88;
  --brand-strong:#0a6d67;
  --brand-soft:#e3f4f2;
  --brand-line:#bfe2de;
  --line:#ddeae8;
  --warn:#9a5b06;
  --warn-bg:#fdf6e8;
  --danger:#b4472f;
  --radius:14px;
  --shadow:0 1px 2px rgba(16,46,44,.05), 0 10px 26px rgba(16,46,44,.055);
}

*{ box-sizing:border-box; }

html,body{ margin:0; padding:0; }

body{
  background:var(--bg);
  color:var(--ink);
  font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
              "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
  font-size:16px;
  line-height:1.65;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}

h1,h2,h3,p,ul,ol,blockquote{ margin:0; }
ul,ol{ padding:0; list-style:none; }

/* ============================================================
   2. 页面骨架
   ============================================================ */
.page{
  max-width:900px;
  margin:0 auto;
  padding:30px 16px 80px;
}

/* 首屏标题区 */
.hero{ margin-bottom:22px; }

.hero h1{
  font-size:clamp(1.55rem, 4.4vw, 2.05rem);
  line-height:1.3;
  letter-spacing:-.01em;
  font-weight:700;
  color:var(--ink);
}

.hero .subtitle{
  margin-top:10px;
  color:var(--ink-soft);
  font-size:15px;
  max-width:46em;
}

/* 通用卡片 */
.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  padding:22px 20px;
}

.card + .card{ margin-top:16px; }

.card-title{
  font-size:17px;
  font-weight:700;
  letter-spacing:.01em;
  display:flex;
  align-items:center;
  gap:9px;
}

.card-title::before{
  content:"";
  width:4px;
  height:16px;
  border-radius:2px;
  background:var(--brand);
  flex:none;
}

.card-note{
  margin-top:6px;
  color:var(--muted);
  font-size:13.5px;
}

/* ============================================================
   3. 表单：选项组（chip 单选）
   ============================================================ */
.form-card{ padding-bottom:26px; }

.field{
  border:0;
  margin:0;
  padding:0;
}

.field + .field{
  margin-top:22px;
  padding-top:20px;
  border-top:1px dashed var(--line);
}

.field legend{
  font-size:15px;
  font-weight:700;
  color:var(--ink);
  padding:0;
  margin-bottom:11px;
}

.field legend .num{
  display:inline-block;
  min-width:20px;
  color:var(--brand);
  font-variant-numeric:tabular-nums;
}

.chips{
  display:grid;
  grid-template-columns:repeat(auto-fit, minmax(148px, 1fr));
  gap:10px;
}

.chip{ display:block; position:relative; }

.chip input{
  position:absolute;
  width:1px; height:1px;
  opacity:0;
  margin:0;
  pointer-events:none;
}

.chip span{
  display:block;
  padding:11px 12px;
  border:1px solid var(--line);
  border-radius:10px;
  background:#fbfdfd;
  color:var(--ink-soft);
  font-size:15px;
  text-align:center;
  cursor:pointer;
  transition:background-color .15s ease, border-color .15s ease, color .15s ease;
  user-select:none;
}

.chip span:hover{ border-color:var(--brand-line); background:#f4fbfa; }

.chip input:checked + span{
  border-color:var(--brand);
  background:var(--brand-soft);
  color:var(--brand-strong);
  font-weight:600;
  box-shadow:inset 0 0 0 1px var(--brand);
}

.chip input:focus-visible + span{
  outline:2px solid var(--brand);
  outline-offset:2px;
}

/* 未选择时的错误提示 */
.field.is-invalid legend{ color:var(--danger); }
.field.is-invalid .chip span{ border-color:#e8c4bb; }
.field.is-invalid .chip input:focus-visible + span{ outline-color:var(--danger); }
.field-error{
  display:none;
  margin-top:9px;
  font-size:13px;
  color:var(--danger);
}
.field.is-invalid .field-error{ display:block; }

/* ============================================================
   4. 按钮与操作区
   ============================================================ */
.actions{
  margin-top:22px;
  display:flex;
  flex-wrap:wrap;
  gap:11px;
  align-items:center;
}

.btn{
  font-family:inherit;
  font-size:15px;
  font-weight:600;
  line-height:1.2;
  padding:12px 20px;
  border-radius:10px;
  border:1px solid transparent;
  cursor:pointer;
  transition:background-color .15s ease, border-color .15s ease, color .15s ease;
  min-height:44px;
}

.btn:focus-visible{ outline:2px solid var(--brand); outline-offset:2px; }

.btn-primary{
  background:var(--brand);
  color:#fff;
  border-color:var(--brand);
}
.btn-primary:hover:not(:disabled){ background:var(--brand-strong); border-color:var(--brand-strong); }

.btn-ghost{
  background:#fff;
  color:var(--brand-strong);
  border-color:var(--brand-line);
}
.btn-ghost:hover:not(:disabled){ background:var(--brand-soft); }

.btn:disabled{
  opacity:.55;
  cursor:not-allowed;
}

.actions .spacer{ flex:1 1 auto; }

/* 全局提示条（校验 / 状态） */
.notice{
  display:none;
  margin-top:16px;
  padding:12px 14px;
  border-radius:10px;
  font-size:14px;
  border:1px solid #f0d9ac;
  background:var(--warn-bg);
  color:var(--warn);
}
.notice.is-visible{ display:block; }
.notice.is-info{
  border-color:var(--brand-line);
  background:var(--brand-soft);
  color:var(--brand-strong);
}

/* ============================================================
   5. 结果区
   ============================================================ */
#resultSection[hidden]{ display:none; }

#resultSection{ margin-top:22px; }

/* 结果过期提示 */
.stale-bar{
  display:none;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  flex-wrap:wrap;
  padding:12px 14px;
  margin-bottom:14px;
  border-radius:10px;
  background:var(--warn-bg);
  border:1px solid #f0d9ac;
  color:var(--warn);
  font-size:14px;
}
.stale-bar.is-visible{ display:flex; }
.stale-bar .btn{ min-height:36px; padding:8px 14px; font-size:14px; }

/* 概览 */
.summary-head{
  display:flex;
  flex-wrap:wrap;
  align-items:flex-start;
  justify-content:space-between;
  gap:12px;
}

.summary-task{
  font-size:20px;
  font-weight:700;
  letter-spacing:-.01em;
}

.summary-task .tag{
  display:inline-block;
  margin-left:8px;
  vertical-align:2px;
  padding:3px 9px;
  border-radius:999px;
  background:var(--brand-soft);
  border:1px solid var(--brand-line);
  color:var(--brand-strong);
  font-size:12.5px;
  font-weight:700;
}

.meta-list{
  margin-top:14px;
  display:flex;
  flex-wrap:wrap;
  gap:8px;
}

.meta-item{
  padding:5px 11px;
  border-radius:8px;
  background:#f6faf9;
  border:1px solid var(--line);
  font-size:13.5px;
  color:var(--ink-soft);
}
.meta-item b{ color:var(--ink); font-weight:600; }

/* 优先事项 */
.priority-card{
  margin-top:16px;
  background:linear-gradient(180deg,#f2fbfa 0%, #ffffff 100%);
  border:1px solid var(--brand-line);
  border-radius:var(--radius);
  padding:18px 20px;
}

.priority-list li{
  display:flex;
  gap:10px;
  padding:8px 0;
  font-size:15px;
  color:var(--ink);
}
.priority-list li + li{ border-top:1px dashed var(--brand-line); }

.priority-list .idx{
  flex:none;
  width:22px; height:22px;
  margin-top:2px;
  border-radius:50%;
  background:var(--brand);
  color:#fff;
  font-size:12.5px;
  font-weight:700;
  display:flex;
  align-items:center;
  justify-content:center;
  font-variant-numeric:tabular-nums;
}

/* 每日安排 */
.days{ margin-top:16px; }

.day-card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  padding:16px 18px;
}
.day-card + .day-card{ margin-top:11px; }

.day-head{
  display:flex;
  align-items:baseline;
  justify-content:space-between;
  gap:10px;
  flex-wrap:wrap;
  padding-bottom:11px;
  border-bottom:1px solid var(--line);
}

.day-name{
  font-size:16px;
  font-weight:700;
}

.day-mode{
  margin-left:8px;
  font-size:12px;
  font-weight:600;
  padding:2px 8px;
  border-radius:999px;
  background:#f1f6f5;
  color:var(--muted);
  border:1px solid var(--line);
}
.day-mode.focus{
  background:var(--brand-soft);
  border-color:var(--brand-line);
  color:var(--brand-strong);
}

.day-total{
  font-size:13px;
  color:var(--muted);
  font-variant-numeric:tabular-nums;
}

/* 单个时段任务 */
.session{
  padding:13px 0;
}
.session + .session{ border-top:1px dashed var(--line); }

.session-head{
  display:flex;
  flex-wrap:wrap;
  align-items:center;
  gap:8px;
}

.slot{
  flex:none;
  padding:2px 9px;
  border-radius:6px;
  background:#eef4ff;
  border:1px solid #d6e2f8;
  color:#31518f;
  font-size:12.5px;
  font-weight:700;
  letter-spacing:.02em;
}

.session-title{
  flex:1 1 240px;
  font-size:15.5px;
  font-weight:600;
  color:var(--ink);
}

.session-mins{
  flex:none;
  font-size:13px;
  color:var(--brand-strong);
  background:var(--brand-soft);
  border:1px solid var(--brand-line);
  border-radius:6px;
  padding:2px 8px;
  font-variant-numeric:tabular-nums;
  font-weight:600;
}

.session-done{
  margin-top:7px;
  padding-left:2px;
  font-size:14px;
  color:var(--ink-soft);
}
.session-done .label{
  color:var(--muted);
  font-weight:600;
  margin-right:6px;
}

/* 不要做的事 */
.avoid-card{
  margin-top:16px;
  background:#fffdf8;
  border:1px solid #f0e3c8;
  border-radius:var(--radius);
  padding:18px 20px;
}

.avoid-list li{
  display:flex;
  gap:10px;
  padding:7px 0;
  font-size:15px;
  color:#6b5327;
}
.avoid-list .mark{
  flex:none;
  width:18px; height:18px;
  margin-top:3px;
  border-radius:50%;
  background:#f6e7cb;
  color:#8a6526;
  font-size:12px;
  font-weight:700;
  display:flex;
  align-items:center;
  justify-content:center;
}

/* 鼓励语 */
.encourage{
  margin-top:16px;
  padding:16px 18px;
  border-left:3px solid var(--brand);
  background:#f7fbfa;
  border-radius:0 var(--radius) var(--radius) 0;
  font-size:15px;
  color:var(--ink);
}
.encourage .label{
  display:block;
  font-size:12.5px;
  font-weight:700;
  letter-spacing:.06em;
  color:var(--brand-strong);
  margin-bottom:5px;
}

/* 结果底部操作 */
.result-actions{
  margin-top:18px;
  display:flex;
  flex-wrap:wrap;
  gap:11px;
}

/* ============================================================
   6. 轻提示（toast）
   ============================================================ */
#toast{
  position:fixed;
  left:50%;
  bottom:28px;
  transform:translate(-50%, 12px);
  z-index:50;
  padding:10px 18px;
  border-radius:999px;
  background:#12312f;
  color:#fff;
  font-size:14px;
  opacity:0;
  pointer-events:none;
  transition:opacity .18s ease, transform .18s ease;
  max-width:calc(100% - 32px);
}
#toast.is-visible{
  opacity:1;
  transform:translate(-50%, 0);
}

/* ============================================================
   7. 响应式适配
   ============================================================ */
@media (max-width:600px){
  .page{ padding:22px 13px 70px; }
  .card{ padding:18px 15px; }
  .chips{ grid-template-columns:repeat(2, minmax(0, 1fr)); gap:8px; }
  .chip span{ padding:11px 6px; font-size:14px; }
  .actions .btn{ flex:1 1 100%; }
  .actions .spacer{ display:none; }
  .result-actions .btn{ flex:1 1 100%; }
  .summary-task{ font-size:18px; }
  .day-card{ padding:14px 14px; }
  .session-title{ flex:1 1 100%; order:3; }
  .session-mins{ margin-left:auto; }
  .session-done{ font-size:13.5px; }
}

@media (min-width:760px){
  .days{ display:block; }
}

/* 尊重系统的“减少动态效果”设置 */
@media (prefers-reduced-motion: reduce){
  *{ transition:none !important; animation:none !important; }
}
</style>
</head>
<body>

<main class="page">

  <!-- ============ 首屏标题 ============ -->
  <header class="hero">
    <h1>大学生一周学习计划生成器</h1>
    <p class="subtitle">根据你的任务、可用时间和薄弱项，生成一周学习安排。</p>
  </header>

  <!-- ============ 输入区 ============ -->
  <section class="card form-card" aria-labelledby="formTitle">
    <h2 class="card-title" id="formTitle">先做四个选择</h2>
    <p class="card-note">四项都选完才能生成计划。所有计算都在你的浏览器里完成，不上传任何信息。</p>

    <form id="planForm" novalidate style="margin-top:20px;">

      <!-- 1 当前任务 -->
      <fieldset class="field" data-field="task">
        <legend><span class="num">1.</span> 当前任务</legend>
        <div class="chips">
          <label class="chip"><input type="radio" name="task" value="review"><span>复习备考</span></label>
          <label class="chip"><input type="radio" name="task" value="homework"><span>完成作业</span></label>
          <label class="chip"><input type="radio" name="task" value="cert"><span>考证准备</span></label>
          <label class="chip"><input type="radio" name="task" value="thesis"><span>毕业设计资料整理</span></label>
        </div>
        <p class="field-error">请先选择当前任务</p>
      </fieldset>

      <!-- 2 每天可用时间 -->
      <fieldset class="field" data-field="time">
        <legend><span class="num">2.</span> 每天可用时间</legend>
        <div class="chips">
          <label class="chip"><input type="radio" name="time" value="t1"><span>1 小时以内</span></label>
          <label class="chip"><input type="radio" name="time" value="t2"><span>1～2 小时</span></label>
          <label class="chip"><input type="radio" name="time" value="t3"><span>2～3 小时</span></label>
          <label class="chip"><input type="radio" name="time" value="t4"><span>3 小时以上</span></label>
        </div>
        <p class="field-error">请先选择每天可用时间</p>
      </fieldset>

      <!-- 3 薄弱项 -->
      <fieldset class="field" data-field="weak">
        <legend><span class="num">3.</span> 薄弱项</legend>
        <div class="chips">
          <label class="chip"><input type="radio" name="weak" value="concept"><span>概念理解</span></label>
          <label class="chip"><input type="radio" name="weak" value="calc"><span>计算练习</span></label>
          <label class="chip"><input type="radio" name="weak" value="organize"><span>资料整理</span></label>
          <label class="chip"><input type="radio" name="weak" value="express"><span>表达输出</span></label>
        </div>
        <p class="field-error">请先选择薄弱项</p>
      </fieldset>

      <!-- 4 截止紧迫度 -->
      <fieldset class="field" data-field="urgency">
        <legend><span class="num">4.</span> 一周内截止时间</legend>
        <div class="chips">
          <label class="chip"><input type="radio" name="urgency" value="urgent"><span>很紧急</span></label>
          <label class="chip"><input type="radio" name="urgency" value="within"><span>一周内</span></label>
          <label class="chip"><input type="radio" name="urgency" value="loose"><span>时间较宽松</span></label>
        </div>
        <p class="field-error">请先选择截止紧迫度</p>
      </fieldset>

      <!-- 操作按钮 -->
      <div class="actions">
        <button type="submit" class="btn btn-primary" id="generateBtn">生成本周计划</button>
        <span class="spacer"></span>
        <button type="button" class="btn btn-ghost" id="resetBtn">重新生成</button>
      </div>

      <p class="notice" id="notice" role="status" aria-live="polite"></p>
    </form>
  </section>

  <!-- ============ 结果区 ============ -->
  <section id="resultSection" aria-live="polite" hidden>

    <!-- 选项变更后的过期提示 -->
    <div class="stale-bar" id="staleBar">
      <span>选项已更改，当前计划已过期，需要重新生成。</span>
      <button type="button" class="btn btn-primary" id="regenInlineBtn">按新选项生成</button>
    </div>

    <!-- 概览 -->
    <div class="card">
      <div class="summary-head">
        <div>
          <h2 class="summary-task" id="summaryTask"></h2>
          <div class="meta-list" id="summaryMeta"></div>
        </div>
      </div>
    </div>

    <!-- 本周优先事项 -->
    <div class="card priority-card">
      <h2 class="card-title" style="margin-bottom:6px;">本周优先事项</h2>
      <p class="card-note" style="margin-bottom:8px;">这一周只对这三件事负责，其余都是加分项。</p>
      <ol class="priority-list" id="priorityList"></ol>
    </div>

    <!-- 每日安排 -->
    <div class="days" id="dayList"></div>

    <!-- 不要做的事 -->
    <div class="card avoid-card">
      <h2 class="card-title" style="margin-bottom:6px;">先不要分散精力做的事</h2>
      <p class="card-note" style="margin-bottom:8px;">这些事看着有用，但这一周会偷走你的时间。</p>
      <ul class="avoid-list" id="avoidList"></ul>
    </div>

    <!-- 鼓励 -->
    <blockquote class="encourage">
      <span class="label">本周一句</span>
      <span id="encourageText"></span>
    </blockquote>

    <!-- 结果操作 -->
    <div class="result-actions">
      <button type="button" class="btn btn-primary" id="copyBtn">复制计划文本</button>
      <button type="button" class="btn btn-ghost" id="downloadBtn">导出 .txt 文件</button>
    </div>
  </section>

</main>

<!-- 轻提示 -->
<div id="toast" role="status" aria-live="polite"></div>

<script>
/* ============================================================
   第 1 段：静态配置（选项标签、时间预算、节奏规则）
   ============================================================ */

// 每天可用时间 → 单词投入时长（分钟）与任务段数
// 原则：时间越少，段数越少，计划越集中
const TIME_CONFIG = {
  t1: { label:'1 小时以内', minutes:50,  sessions:1 },
  t2: { label:'1～2 小时',  minutes:100, sessions:2 },
  t3: { label:'2～3 小时',  minutes:150, sessions:2 },
  t4: { label:'3 小时以上', minutes:210, sessions:3 }
};

// 不同任务段数对应的时段
const SLOTS_BY_COUNT = {
  1: ['晚上'],
  2: ['傍晚', '晚上'],
  3: ['上午', '傍晚', '晚上']
};

const DAY_NAMES = ['周一','周二','周三','周四','周五','周六','周日'];

// 轻量日投入（分钟）
const LIGHT_MINUTES = 25;

// 截止紧迫度 → 一周节奏
// modes：focus = 正常投入日，light = 轻量日
// drillEvery：每隔几天做一次薄弱项专项（数字越小频率越高）
const URGENCY_CONFIG = {
  urgent: {
    label: '很紧急',
    modes: ['focus','focus','focus','focus','focus','focus','focus'],
    drillEvery: 1
  },
  within: {
    label: '一周内',
    modes: ['focus','focus','focus','focus','focus','focus','light'],
    drillEvery: 2
  },
  loose: {
    label: '时间较宽松',
    modes: ['focus','light','focus','light','focus','focus','light'],
    drillEvery: 3
  }
};

const WEAK_LABEL = {
  concept: '概念理解',
  calc: '计算练习',
  organize: '资料整理',

// 截止紧迫度 → 优先事项与规避项补充
const URGENCY_EXTRA = {
  urgent: {
    priority: '离截止很近：优先保证“做题 + 错题重做”的次数，覆盖面先放一边。',
    avoid: '不要熬夜补时长，第二天效率掉下来更亏。'
  },
  within: {
    priority: '一周内要交：周中过半时必须有一次完整自测，别把检验留到最后一天。',
    avoid: '不要把整块任务堆到周末，那时候只剩赶工。'
  },
  loose: {
    priority: '时间较宽松：把基础打扎实，宁可少推进一块，也不要留下没弄懂的地方。',
    avoid: '不要同时开三条线，宽松的时间最容易被浪费掉。'
  }
};

/* ============================================================
   第 3 段：工具函数
   ============================================================ */

// 把总分钟数按权重切分到各时段，取 5 分钟整
function splitMinutes(total, count) {
  if (count <= 1) return [total];
  const weights = count === 2 ? [0.5, 0.5] : [0.35, 0.35, 0.30];
  const parts = weights.map(w => Math.round(total * w / 5) * 5);
  const diff = total - parts.reduce((a, b) => a + b, 0);
  parts[parts.length - 1] += diff;
  return parts;
}

// 分钟数转可读文本
function formatDuration(minutes) {
  if (minutes < 60) return minutes + ' 分钟';
  const h = Math.floor(minutes / 60);
  const m = minutes % 60;
  return m === 0 ? h + ' 小时' : h + ' 小时 ' + m + ' 分钟';
}

// 读取当前表单选择
function readForm() {
  const form = document.getElementById('planForm');
  const data = new FormData(form);
  return {
    task: data.get('task') || '',
    time: data.get('time') || '',
    weak: data.get('weak') || '',
    urgency: data.get('urgency') || ''
  };
}

/* ============================================================
   第 4 段：核心生成逻辑
   规则落地：
   - 紧迫度决定一周有几天投入、薄弱项专项的频率
   - 每天可用时间决定任务段数，时间越少段数越少、越集中
   - 薄弱项专项放在当天最后一个时段，优先保住“练”的时间
   ============================================================ */
function buildPlan(input) {
  const taskPlan = TASK_PLANS[input.task];
  const urgency = URGENCY_CONFIG[input.urgency];
  const timeCfg = TIME_CONFIG[input.time];
  const drillUnits = taskPlan.drills[input.weak];

  let coreCursor = 0;   // 核心任务游标
  let drillCursor = 0;  // 薄弱项专项游标
  const days = [];

  // 核心任务序列 = 主流程 + 收尾动作。主流程走完后接收尾，避免机械重复第一个动作
  const coreSequence = taskPlan.core.concat(taskPlan.extras);

  // ---- 先算出这一周哪几天要安排薄弱项专项 ----
  const focusDays = [];
  urgency.modes.forEach((m, idx) => { if (m === 'focus') focusDays.push(idx); });

  let drillDays;
  if (timeCfg.sessions >= 2) {
    // 一天有多个时段：专项只占当天最后一个时段，频率按紧迫度铺满投入日
    drillDays = focusDays.filter((_, k) => k % urgency.drillEvery === 0);
  } else {
    // 一天只有一个时段：专项会占据整天，因此不放在第一天，并控制总量
    const wanted = input.urgency === 'urgent' ? 3 : input.urgency === 'within' ? 2 : 1;
    const poolDays = focusDays.slice(1);
    const drillTotal = Math.min(wanted, poolDays.length);
    drillDays = [];
    for (let k = 0; k < drillTotal; k++) {
      const pos = Math.max(0, Math.min(poolDays.length - 1,
        Math.round((k + 1) * poolDays.length / (drillTotal + 1)) - 1));
      if (drillDays.indexOf(poolDays[pos]) === -1) drillDays.push(poolDays[pos]);
    }
  }

  for (let i = 0; i < DAY_NAMES.length; i++) {
    const mode = urgency.modes[i];
    const isLight = mode === 'light';
    const sessionCount = isLight ? 1 : timeCfg.sessions;
    const dayMinutes = isLight ? LIGHT_MINUTES : timeCfg.minutes;
    const slots = SLOTS_BY_COUNT[sessionCount];
    const durations = splitMinutes(dayMinutes, sessionCount);

    // 轻量日不安排整套专项，只做低强度回看
    const isDrillDay = !isLight && drillDays.indexOf(i) !== -1;

    const sessions = [];

    for (let s = 0; s < sessionCount; s++) {
      const isLastSession = s === sessionCount - 1;

      // 当天最后一个时段留给薄弱项专项
      if (isLastSession && isDrillDay) {
        const idx = drillCursor % drillUnits.length;
        const round = Math.floor(drillCursor / drillUnits.length);
        drillCursor++;
        const unit = drillUnits[idx];
        sessions.push({
          slot: slots[s],
          title: unit.t + (round > 0 ? '（限时压缩 20%，再做一轮）' : ''),
          done: unit.d,
          minutes: durations[s]
        });
        continue;
      }

      // 轻量日只保留低强度回看
      if (isLight) {
        sessions.push({
          slot: slots[s],
          title: '回看前两天记的东西，挑 3 条最容易忘的再看一遍',
          done: '能默写或复述这 3 条，其余内容不重看',
          minutes: durations[s]
        });
        continue;
      }

      // 常规核心任务
      const idx = coreCursor % coreSequence.length;
      const round = Math.floor(coreCursor / coreSequence.length);
      coreCursor++;
      const unit = coreSequence[idx];
      sessions.push({
        slot: slots[s],
        title: unit.t + (round > 0 ? taskPlan.roundNote : ''),
        done: unit.d,
        minutes: durations[s]
      });
    }

    days.push({
      name: DAY_NAMES[i],
      mode: mode,
      minutes: dayMinutes,
      sessions: sessions
    });
  }

  const totalMinutes = days.reduce((sum, d) => sum + d.minutes, 0);

  return {
    taskLabel: taskPlan.label,
    timeLabel: timeCfg.label,
    weakLabel: WEAK_LABEL[input.weak],
    urgencyLabel: urgency.label,
    totalMinutes: totalMinutes,
    priorities: [
      taskPlan.priority,
      WEAK_PRIORITY[input.weak],
      URGENCY_EXTRA[input.urgency].priority
    ],
    days: days,
    avoid: taskPlan.avoid.concat([URGENCY_EXTRA[input.urgency].avoid]),
    encouragement: ENCOURAGE_TEXT[input.weak]
  };
}

/* ============================================================
   第 5 段：渲染
   ============================================================ */

let currentPlan = null;   // 当前生成的计划对象
let isGenerating = false; // 防重复提交标记

function renderPlan(plan) {
  // 概览
  document.getElementById('summaryTask').innerHTML =
    plan.taskLabel + '<span class="tag">' + plan.urgencyLabel + '</span>';

  document.getElementById('summaryMeta').innerHTML = [
    '每天可用：<b>' + plan.timeLabel + '</b>',
    '薄弱项：<b>' + plan.weakLabel + '</b>',
    '本周总投入：<b>' + formatDuration(plan.totalMinutes) + '</b>'
  ].map(text => '<span class="meta-item">' + text + '</span>').join('');

  // 优先事项
  document.getElementById('priorityList').innerHTML = plan.priorities.map((p, i) =>
    '<li><span class="idx">' + (i + 1) + '</span><span>' + p + '</span></li>'
  ).join('');

  // 每日安排
  document.getElementById('dayList').innerHTML = plan.days.map(day => {
    const modeTag = day.mode === 'light'
      ? '<span class="day-mode">轻量日</span>'
      : '<span class="day-mode focus">投入日</span>';

    const sessionHtml = day.sessions.map(s =>
      '<div class="session">' +
        '<div class="session-head">' +
          '<span class="slot">' + s.slot + '</span>' +
          '<span class="session-title">' + s.title + '</span>' +
          '<span class="session-mins">' + s.minutes + ' 分钟</span>' +
        '</div>' +
        '<p class="session-done"><span class="label">完成标准</span>' + s.done + '</p>' +
      '</div>'
    ).join('');

    return '<article class="day-card">' +
      '<div class="day-head">' +
        '<div><span class="day-name">' + day.name + '</span>' + modeTag + '</div>' +
        '<span class="day-total">当天合计 ' + formatDuration(day.minutes) + '</span>' +
      '</div>' +
      sessionHtml +
    '</article>';
  }).join('');

  // 不要做的事
  document.getElementById('avoidList').innerHTML = plan.avoid.map(item =>
    '<li><span class="mark">×</span><span>' + item + '</span></li>'
  ).join('');

  // 鼓励
  document.getElementById('encourageText').textContent = plan.encouragement;
}

/* ============================================================
   第 6 段：计划文本（复制 / 导出共用）
   ============================================================ */
function planToText(plan) {
  const lines = [];

  lines.push('大学生一周学习计划');
  lines.push('任务类型：' + plan.taskLabel);
  lines.push('每天可用时间：' + plan.timeLabel + '｜薄弱项：' + plan.weakLabel + '｜截止紧迫度：' + plan.urgencyLabel);
  lines.push('本周总投入：约 ' + formatDuration(plan.totalMinutes));
  lines.push('');

  lines.push('【本周优先事项】');
  plan.priorities.forEach((p, i) => lines.push((i + 1) + '. ' + p));
  lines.push('');

  plan.days.forEach(day => {
    lines.push('【' + day.name + '】' + (day.mode === 'light' ? '轻量日' : '投入日') + '，合计 ' + day.minutes + ' 分钟');
    day.sessions.forEach(s => {
      lines.push('  · 时段：' + s.slot);
      lines.push('    任务：' + s.title);
      lines.push('    时长：' + s.minutes + ' 分钟');
      lines.push('    完成标准：' + s.done);
    });
  });
  lines.push('');

  lines.push('【先不要分散精力做的事】');
  plan.avoid.forEach(a => lines.push('- ' + a));
  lines.push('');

  lines.push('【本周一句】' + plan.encouragement);

  return lines.join('\n');
}

/* ============================================================
   第 7 段：交互绑定
   ============================================================ */

const form = document.getElementById('planForm');
const noticeEl = document.getElementById('notice');
const resultSection = document.getElementById('resultSection');
const staleBar = document.getElementById('staleBar');
const generateBtn = document.getElementById('generateBtn');
const toastEl = document.getElementById('toast');

let toastTimer = null;

// 轻提示
function showToast(text) {
  toastEl.textContent = text;
  toastEl.classList.add('is-visible');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove('is-visible'), 1900);
}

// 顶部提示条
function showNotice(text, isInfo) {
  noticeEl.textContent = text;
  noticeEl.classList.toggle('is-info', !!isInfo);
  noticeEl.classList.add('is-visible');
}

function hideNotice() {
  noticeEl.classList.remove('is-visible');
}

// 标记未完成的选项组
function markInvalidFields(missingFields) {
  document.querySelectorAll('.field').forEach(field => {
    const key = field.getAttribute('data-field');
    field.classList.toggle('is-invalid', missingFields.indexOf(key) !== -1);
  });
}

function clearInvalidFields() {
  document.querySelectorAll('.field').forEach(field => field.classList.remove('is-invalid'));
}

// 生成（提交）
form.addEventListener('submit', event => {
  event.preventDefault();

  // 防重复提交
  if (isGenerating) return;

  const input = readForm();
  const missing = [];
  if (!input.task) missing.push('task');
  if (!input.time) missing.push('time');
  if (!input.weak) missing.push('weak');
  if (!input.urgency) missing.push('urgency');

  if (missing.length > 0) {
    markInvalidFields(missing);
    resultSection.hidden = true;
    currentPlan = null;
    showNotice('还差 ' + missing.length + ' 项没选，请先完成：' +
      missing.map(k => {
        if (k === 'task') return '当前任务';
        if (k === 'time') return '每天可用时间';
        if (k === 'weak') return '薄弱项';
        return '截止紧迫度';
      }).join('、') + '。');
    // 聚焦第一个未选项
    const firstField = document.querySelector('.field.is-invalid .chip input');
    if (firstField) firstField.focus();
    return;
  }

  isGenerating = true;
  generateBtn.disabled = true;
  generateBtn.textContent = '生成中…';

  // 极短延迟，仅用于让防重复提交真正生效，不做动画
  setTimeout(() => {
    try {
      currentPlan = buildPlan(input);
      renderPlan(currentPlan);
      resultSection.hidden = false;
      staleBar.classList.remove('is-visible');
      clearInvalidFields();
      hideNotice();

      generateBtn.textContent = '已生成';
      setTimeout(() => {
        generateBtn.textContent = '生成本周计划';
        generateBtn.disabled = false;
        isGenerating = false;
      }, 600);

      // 滚动到结果
      resultSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
    } catch (err) {
      generateBtn.textContent = '生成本周计划';
      generateBtn.disabled = false;
      isGenerating = false;
      showNotice('生成失败，请刷新页面后重试。');
    }
  }, 180);
});

// 选项变更：提示结果已过期
form.addEventListener('change', () => {
  const field = document.activeElement ? document.activeElement.closest('.field') : null;
  if (field) field.classList.remove('is-invalid');

  if (currentPlan && !resultSection.hidden) {
    staleBar.classList.add('is-visible');
  }
});

// 重新生成：清空当前结果与选项
function resetAll() {
  form.reset();
  currentPlan = null;
  resultSection.hidden = true;
  staleBar.classList.remove('is-visible');
  clearInvalidFields();
  hideNotice();
  showNotice('已清空当前计划。重新选择四项后，点“生成本周计划”。', true);
  document.querySelector('.form-card').scrollIntoView({ behavior: 'smooth', block: 'start' });
  generateBtn.textContent = '生成本周计划';
  generateBtn.disabled = false;
  isGenerating = false;
}

document.getElementById('resetBtn').addEventListener('click', resetAll);
document.getElementById('regenInlineBtn').addEventListener('click', () => {
  document.querySelector('.form-card').scrollIntoView({ behavior: 'smooth', block: 'start' });
  form.requestSubmit();
});

// 复制计划文本
document.getElementById('copyBtn').addEventListener('click', async () => {
  if (!currentPlan) return;
  const text = planToText(currentPlan);

  try {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      await navigator.clipboard.writeText(text);
    } else {
      fallbackCopy(text);
    }
    showToast('计划已复制到剪贴板');
  } catch (err) {
    try {
      fallbackCopy(text);
      showToast('计划已复制到剪贴板');
    } catch (e) {
      showToast('复制失败，请手动选择文本');
    }
  }
});

// 兼容旧浏览器的复制方式
function fallbackCopy(text) {
  const area = document.createElement('textarea');
  area.value = text;
  area.setAttribute('readonly', '');
  area.style.position = 'fixed';
  area.style.top = '-9999px';
  document.body.appendChild(area);
  area.select();
  document.execCommand('copy');
  document.body.removeChild(area);
}

// 导出 .txt
document.getElementById('downloadBtn').addEventListener('click', () => {
  if (!currentPlan) return;

  const text = planToText(currentPlan);
  const blob = new Blob(['\ufeff' + text], { type: 'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob);

  const now = new Date();
  const stamp = now.getFullYear() + '-' +
    String(now.getMonth() + 1).padStart(2, '0') + '-' +
    String(now.getDate()).padStart(2, '0');

  const link = document.createElement('a');
  link.href = url;
  link.download = '本周学习计划_' + currentPlan.taskLabel + '_' + stamp + '.txt';
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
  URL.revokeObjectURL(url);

  showToast('已导出 .txt 文件');
});
</script>
</body>
